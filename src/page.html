<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Moss Keeper</title>
<meta name="description" content="A short hand-drawn style anime scene: at sunrise an ancient overgrown giant wakes in a forgotten forest and rises into the golden sky.">
<style>
:root {
  --ink: #f3ead8;
  --dim: rgba(243, 234, 216, .62);
  --line: rgba(243, 234, 216, .28);
  --bg: #07060a;
  --accent: #f2c879;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
#stage {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
}
#frame {
  position: relative;
  width: min(100vw, calc(100vh * 1.8462));
  width: min(100dvw, calc(100dvh * 1.8462));
  aspect-ratio: 1920 / 1040;
  background: #000;
  overflow: hidden;
  cursor: pointer;
  box-shadow: 0 0 120px rgba(242, 200, 121, .05);
}
video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  background: #000;
}
#poster {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: opacity .9s ease;
}
#grain {
  position: absolute;
  inset: -4px;
  pointer-events: none;
  opacity: .055;
  mix-blend-mode: overlay;
}
.fade { transition: opacity .5s ease; }
#veil {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  text-align: center;
  padding: 16px;
  background: radial-gradient(ellipse at center, rgba(7, 6, 10, .12), rgba(7, 6, 10, .5));
}
#veil[hidden] { display: none; }
h1 {
  margin: 0;
  font-weight: 400;
  font-size: clamp(24px, 4.6vw, 54px);
  letter-spacing: .09em;
  text-shadow: 0 2px 24px rgba(0, 0, 0, .65);
}
button {
  font: inherit;
  color: var(--ink);
  background: rgba(10, 9, 14, .46);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 11px 24px;
  font-size: clamp(14px, 1.5vw, 17px);
  letter-spacing: .06em;
  cursor: pointer;
  min-height: 44px;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  transition: background .2s, border-color .2s;
}
button:hover { background: rgba(242, 200, 121, .18); border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
#sound {
  position: absolute;
  right: clamp(10px, 2vw, 24px);
  top: clamp(10px, 2vw, 24px);
  opacity: 0;
  pointer-events: none;
}
#sound.on { opacity: 1; pointer-events: auto; }
#bar {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 26px clamp(10px, 2vw, 22px) 12px;
  display: flex;
  align-items: center;
  gap: 14px;
  background: linear-gradient(transparent, rgba(5, 4, 8, .62));
  opacity: 0;
}
#frame.show #bar { opacity: 1; }
#track {
  flex: 1;
  height: 18px;
  display: flex;
  align-items: center;
  cursor: pointer;
  touch-action: none;
}
#rail {
  position: relative;
  width: 100%;
  height: 2px;
  background: var(--line);
  border-radius: 2px;
}
#fill {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 0;
  background: var(--accent);
  border-radius: 2px;
}
.ic {
  padding: 0;
  width: 40px;
  height: 40px;
  min-height: 40px;
  flex: none;
  display: grid;
  place-items: center;
  background: transparent;
  border: 0;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}
.ic svg { width: 20px; height: 20px; fill: var(--ink); }
#load {
  position: absolute;
  inset: auto 0 12% 0;
  text-align: center;
  color: var(--dim);
  font-size: 15px;
  letter-spacing: .08em;
}
#credit {
  font-size: 12px;
  letter-spacing: .04em;
  color: var(--dim);
  text-decoration: none;
  white-space: nowrap;
}
#credit:hover { color: var(--accent); }
#noscript {
  position: absolute;
  inset: auto 0 40% 0;
  text-align: center;
  color: var(--dim);
  font-size: 15px;
  line-height: 1.7;
  padding: 0 24px;
}
@media (prefers-reduced-motion: reduce) { #grain { display: none; } }
</style>
{{HEAD_EXTRA}}
</head>
<body>
<div id="stage">
  <div id="frame" role="group" aria-label="The Moss Keeper, animated short film">
    <video id="v" playsinline preload="auto"{{VIDEO_ATTRS}}></video>
    <img id="poster" alt="An ancient giant overgrown with moss kneels in a misty forest at sunrise" src="{{POSTER_SRC}}">
    <canvas id="grain" width="256" height="139"></canvas>
    <div id="veil" hidden><h1 id="ttl">The Moss Keeper</h1><button id="go">Watch with sound</button></div>
    <div id="load">Unrolling the film…</div>
    <noscript><div id="noscript">{{NOSCRIPT}}</div></noscript>
    <button id="sound">Turn sound on</button>
    <div id="bar" class="fade">
      <button class="ic" id="pp" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
      <div id="track" role="slider" aria-label="Seek" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="rail"><div id="fill"></div></div></div>
      <button class="ic" id="fs" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3zm11-5h5v5h-2V6h-3zM6 15v3h3v2H4v-5zm12 3v-3h2v5h-5v-2z"/></svg></button>
      <a id="credit" href="https://github.com/ChetasLua/moss-keeper" rel="noopener">film by ChetasLua</a>
    </div>
  </div>
</div>
{{REEL}}
<script>
{{PLAYER}}
</script>
</body>
</html>
